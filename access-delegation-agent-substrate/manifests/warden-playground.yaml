apiVersion: v1
kind: Namespace
metadata:
  name: warden
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warden
  namespace: warden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: warden
  template:
    metadata:
      labels:
        app: warden
    spec:
      containers:
      - name: warden
        image: ghcr.io/stephnangue/warden:v0.22.0
        args: ["-dev-playground", "-dev-root-token=root"]
        ports:
        - name: http
          containerPort: 8400
        readinessProbe:
          httpGet:
            path: /v1/sys/health
            port: 8400
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: warden
  namespace: warden
spec:
  selector:
    app: warden
  ports:
  - name: http
    port: 8400
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: warden-on-behalf
  namespace: warden
spec:
  selector:
    app: warden
  ports:
  - name: http
    port: 8400
    targetPort: http
